name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Typecheck explicitly: `next build` does run TS, but a build-config
      # change could skip it, and a type error must never reach main.
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test
      # Build runs in localStorage mode (no Supabase env needed).
      - run: npm run build
