name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Typecheck explicitly: `next build` does run TS, but a build-config
      # change could skip it, and a type error must never reach main.
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test
      # The JSON snapshot of every course must match the seeds it was generated from.
      - run: npm run content:export && git diff --exit-code -- content/ docs/courses/build-sheets/ docs/courses/cert-coverage/ docs/courses/skills/
      # Build runs in localStorage mode (no Supabase env needed).
      - run: npm run build

  # The database schema, on a real Postgres. Applies supabase/setup.sql to an
  # empty postgres:16 and runs supabase/tests/rls.sql — the "who can read what"
  # table as assertions. RLS mistakes (a self-referencing policy, a column a
  # student can flip) only surface when the SQL actually runs, so it runs here.
  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v4
      - run: PGURL=postgres://postgres:postgres@localhost:5432/postgres bash scripts/db-check.sh

  # The edge functions, on Deno (R113). The shared helpers — the CORS
  # preflight, the stamp codec and the receipt rules — are pure and unit-tested
  # here; every function type-checks against the supabase-js the hosted
  # runtime imports. The vitest suite pins the codec to the client stamp.
  functions:
    runs-on: ubuntu-latest
    env:
      # The repository's package.json belongs to the Next app; Deno must not resolve it.
      DENO_NO_PACKAGE_JSON: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --no-config supabase/functions/_shared
      - run: deno check --no-config supabase/functions/*/index.ts
      # The paste-ready copies the setup guide deploys from the dashboard (R115).
      - run: deno check --no-config supabase/dashboard/*.ts
